name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

defaults:
  run:
    working-directory: athlete-mobile

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: athlete-mobile/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: athlete-mobile/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate Expo Router types
        run: pnpm expo-router-generate-types
      - name: Type check
        run: pnpm type-check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: athlete-mobile/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: athlete-mobile/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: athlete-mobile/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: athlete-mobile/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format check
        run: pnpm format-check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: athlete-mobile/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: athlete-mobile/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Test
        run: pnpm test
