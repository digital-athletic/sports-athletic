name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Browsers and system deps ship in the image. The tag must match the
      # pinned @playwright/test version in package.json; bump both together.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    if: contains(github.event.pull_request.labels.*.name, 'app-mobile-app-athlete')
    defaults:
      run:
        working-directory: athlete-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: athlete-mobile/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: athlete-mobile/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
          # Serve a production export instead of the Metro dev server
          E2E_STATIC: 1
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          # The html reporter writes playwright-report/, traces and screenshots
          # land in playwright/output/. Both are needed to debug a failure.
          path: |
            athlete-mobile/playwright-report
            athlete-mobile/playwright/output
          retention-days: 30

  e2e-trainer-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Browsers and system deps ship in the image. The tag must match the
      # pinned @playwright/test version in package.json; bump both together.
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --user 1001
    if: contains(github.event.pull_request.labels.*.name, 'web-trainer-dashboard')
    defaults:
      run:
        working-directory: trainer-web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: trainer-web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "24.22.1"
          cache: "pnpm"
          cache-dependency-path: trainer-web/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run E2E tests
        run: pnpm test:e2e
        env:
          CI: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-trainer-web
          # The html reporter writes playwright-report/, traces and screenshots
          # land in playwright/output/. Both are needed to debug a failure.
          path: |
            trainer-web/playwright-report
            trainer-web/playwright/output
          retention-days: 30
