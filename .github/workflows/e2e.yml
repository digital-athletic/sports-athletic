name: E2E Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

jobs:
  e2e:
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.labels.*.name, 'app-mobile-app-athlete')
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"
          cache: "pnpm"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        run: pnpm --filter athlete-mobile exec playwright install webkit --with-deps
      - name: Run E2E tests
        run: pnpm --filter athlete-mobile test:e2e
        env:
          CI: true
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: athlete-mobile/playwright/output
          retention-days: 30
