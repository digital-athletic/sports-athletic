services:
  athlete-mobile:
    build: ./athlete-mobile
    working_dir: /workspace/athlete-mobile
    volumes:
      - ./:/workspace
      - app_node_modules:/workspace/athlete-mobile/node_modules
    network_mode: host
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    stdin_open: true
    tty: true

  trainer-web:
    build: ./trainer-web
    working_dir: /workspace/trainer-web
    volumes:
      - ./:/workspace
      - web_trainer_node_modules:/workspace/trainer-web/node_modules
    network_mode: host
    environment:
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    stdin_open: true
    tty: true

  playwright:
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    container_name: playwright
    network_mode: host
    expose:
      - "9323"
    command: ["npx", "playwright", "run-server", "--port=9323"]

volumes:
  app_node_modules:
  web_trainer_node_modules:
