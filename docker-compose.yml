services:
  athlete-mobile:
    build: ./athlete-mobile
    working_dir: /workspace/athlete-mobile
    volumes:
      - ./:/workspace
      # use anonymous volumes for node_modules to fix permission problems
      - /workspace/node_modules
      - /workspace/.pnpm-store
      - /workspace/athlete-mobile/node_modules
    ports:
      - 8081:8081
      - 19000:19000
      - 19001:19001
      - 19002:19002
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - TESTING_PLAYWRIGHT_WS_ENDPOINT=ws://playwright:9323
      - TESTING_PLAYWRIGHT_BASE_URL=http://athlete-mobile:8081
    stdin_open: true
    tty: true

  trainer-web:
    build: ./trainer-web
    working_dir: /workspace/trainer-web
    volumes:
      - ./:/workspace
      - web_trainer_node_modules:/workspace/trainer-web/node_modules
    environment:
      - VITE_SUPABASE_URL=${SUPABASE_URL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    ports:
      - 5173:5173
    stdin_open: true
    tty: true

  playwright:
    image: mcr.microsoft.com/playwright:v1.58.0-noble
    container_name: playwright
    expose:
      - "9323"
    command: ["npx", "playwright", "run-server", "--port=9323"]

volumes:
  web_trainer_node_modules:
