services:
  athlete-mobile:
    build: ./athlete-mobile
    working_dir: /workspace/athlete-mobile
    # Run as node (uid 1000) so runtime files match the volume ownership seeded
    # by the Dockerfile and the host user.
    user: node
    volumes:
      - ./:/workspace
      - root_node_modules:/workspace/node_modules
      - pnpm_store:/workspace/.pnpm-store
      - athlete_mobile_node_modules:/workspace/athlete-mobile/node_modules
    ports:
      - 8081:8081
      - 19000:19000
      - 19001:19001
      - 19002:19002
    environment:
      - EXPO_DEVTOOLS_LISTEN_ADDRESS=0.0.0.0
      - REACT_NATIVE_PACKAGER_HOSTNAME=0.0.0.0
      - EXPO_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - EXPO_PUBLIC_SERVER_SYNC_ENABLED=true
      - EXPO_PUBLIC_REVIEW_EMAIL=${REVIEW_EMAIL}
      - EXPO_PUBLIC_ANALYTICS_CONSENT_ENABLED=true
      - EXPO_PUBLIC_REVIEW_OTP=123456
      - EXPO_PUBLIC_SERVER_SYNC_ACTIVITY_ONLY_ENABLED=true
      - EXPO_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - TESTING_PLAYWRIGHT_WS_ENDPOINT=ws://playwright:9323
      - TESTING_PLAYWRIGHT_BASE_URL=http://athlete-mobile:8081
      - EXPO_PUBLIC_LINK_IMPRINT=
      - EXPO_PUBLIC_LINK_A11Y_STATEMENT=
      - EXPO_PUBLIC_LINK_A11Y_FEEDBACK=
      - EXPO_PUBLIC_LINK_PRIVACY=
    stdin_open: true
    tty: true
    networks:
      - default
      - supabase-network

  trainer-web:
    build: ./trainer-web
    working_dir: /workspace/trainer-web
    user: node
    volumes:
      - ./:/workspace
      - root_node_modules:/workspace/node_modules
      - pnpm_store:/workspace/.pnpm-store
      - web_trainer_node_modules:/workspace/trainer-web/node_modules
    environment:
      - VITE_SUPABASE_URL=${SUPABASE_URL_EXTERNAL}
      - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - TESTING_PLAYWRIGHT_WS_ENDPOINT=ws://playwright:9323
      - TESTING_PLAYWRIGHT_BASE_URL=http://trainer-web:5173
    ports:
      - 5173:5173
    stdin_open: true
    tty: true

  playwright:
    image: mcr.microsoft.com/playwright:v1.62.1-noble
    container_name: playwright
    expose:
      - "9323"
    command: ["npx", "playwright@1.62.1", "run-server", "--port=9323", "--host=0.0.0.0"]

volumes:
  root_node_modules:
  pnpm_store:
  athlete_mobile_node_modules:
  web_trainer_node_modules:

networks:
  default:
  # default
  supabase-network:
    external: true
    name: supabase_network_sports-athletic
