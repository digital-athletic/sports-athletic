packages:
  - athlete-mobile
  - trainer-web

# Isolated node_modules with symlinks to the pnpm store
nodeLinker: isolated

# Packages can only access their explicitly declared dependencies
strictPeerDependencies: true

overrides:
  "@babel/core": ">=7.29.6 <8"
  "@tootallnate/once": ">=3.0.1"
  "brace-expansion@5": ">=5.0.6"
  "esbuild": ">=0.28.1"
  "fast-uri": ">=3.1.2"
  "form-data": ">=4.0.6"
  "js-yaml": ">=4.2.0 <5"
  "lodash": ">=4.18.0"
  "postcss": ">=8.5.10"
  "qs": ">=6.15.2"
  "shell-quote": ">=1.8.4"
  "tar": ">=7.5.16"
  "uuid": ">=14.0.0"
  "ws@6": ">=6.2.4 <7"
  "ws@7": ">=7.5.11 <8"
  "ws@8": ">=8.21.0 <9"

allowBuilds:
  esbuild: false
  unrs-resolver: false
