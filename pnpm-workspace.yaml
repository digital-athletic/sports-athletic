packages:
  - athlete-mobile
  - trainer-web

# Isolated node_modules with symlinks to the pnpm store
nodeLinker: isolated

# Packages can only access their explicitly declared dependencies
strictPeerDependencies: true

# Only install versions published at least 7 days ago, so compromised releases are
# pulled from the registry before they reach us.
minimumReleaseAge: 10080

packageExtensions:
  # 5.0.1 doesn't declare react/react-native as peers at all, so pnpm can't
  # scope it per-consumer under isolated node-modules; this makes it resolve
  # against each workspace package's own react version instead of ambient hoisting.
  "@react-native-community/slider@5.0.1":
    peerDependencies:
      react: "*"
      react-native: "*"

overrides:
  "@babel/core": ">=7.29.6 <8"
  "@tootallnate/once": ">=3.0.1"
  # 5.0.8 fixes GHSA-mh99-v99m-4gvg but is younger than minimumReleaseAge; raise once it ages in.
  "brace-expansion@5": ">=5.0.7"
  "esbuild": ">=0.28.1"
  "fast-uri": ">=3.1.3 <4"
  "form-data": ">=4.0.6"
  "js-yaml": ">=4.3.0 <5"
  "lodash": ">=4.18.0"
  # minimatch <10 depends on brace-expansion 1.x/2.x, which have no fix for
  # GHSA-mh99-v99m-4gvg (patched only in >=5.0.8). v9 -> v10 is API-compatible.
  "minimatch@9": ">=10.2.5"
  "postcss": ">=8.5.18"
  "qs": ">=6.15.2"
  "shell-quote": ">=1.8.5"
  "tar": ">=7.5.19"
  "uuid": ">=14.0.0"
  "ws@6": ">=6.2.4 <7"
  "ws@7": ">=7.5.11 <8"
  "ws@8": ">=8.21.0 <9"

allowBuilds:
  esbuild: false
  unrs-resolver: false
