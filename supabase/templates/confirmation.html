<html>
  <body style="font-family: Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 20px;">
    <h2>E-Mail bestätigen</h2>
    <p>Gib diesen Code in der App ein, um deine E-Mail-Adresse zu bestätigen:</p>
    <p style="font-size: 32px; font-weight: bold; letter-spacing: 8px; text-align: center; padding: 16px; background: #f4f4f4; border-radius: 8px;">{{ .Token }}</p>
    <p>Der Code ist 1 Stunde gültig.</p>
    <p style="color: #888; font-size: 12px;">Falls du diese E-Mail nicht angefordert hast, kannst du sie ignorieren.</p>
  </body>
</html>
